<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prospectos Instagram</title>
<style>
  :root { --bg:#fff; --block:#F3F4F7; --ink:#121317; --muted:#6b6f7b; --ok:#1a7f4b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121317; --block:#1e2027; --ink:#f3f4f7; --muted:#9a9eaa; --ok:#4cc38a; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px 16px 60px; }
  .top { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:14px; }
  .bar { height:6px; background:var(--block); border-radius:9px; margin:8px 0 16px; overflow:hidden; }
  .bar div { height:100%; background:var(--ok); width:0; transition:width .3s; }
  .foco { background:var(--block); border-radius:20px; padding:20px; text-align:center; }
  .foco .user { font-size:24px; font-weight:800; word-break:break-all; }
  .foco .meta { color:var(--muted); margin:2px 0 14px; }
  .foco .texto { text-align:left; background:var(--bg); border-radius:14px; padding:12px; font-size:15px; margin-bottom:16px; }
  .go { display:block; width:100%; padding:20px; border-radius:16px; background:var(--ink); color:var(--bg);
    font-size:20px; font-weight:800; text-decoration:none; }
  .fila { display:flex; gap:8px; margin-top:10px; }
  .fila a, .fila button { flex:1; padding:12px; border-radius:12px; border:0; background:var(--bg); color:var(--ink);
    font:inherit; font-weight:600; text-decoration:none; text-align:center; cursor:pointer; }
  .fin { font-size:22px; font-weight:800; padding:30px 0; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tabs button { flex:1; border:0; border-radius:999px; padding:10px; font:inherit; font-weight:700; cursor:pointer;
    background:var(--block); color:var(--ink); }
  .tabs button.on { background:var(--ink); color:var(--bg); }
  details { margin-top:24px; }
  summary { color:var(--muted); cursor:pointer; }
  .item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--block); }
  .item.done span { text-decoration:line-through; color:var(--muted); }
  .item button { border:0; background:var(--block); color:var(--ink); border-radius:999px; padding:6px 12px; font:inherit; font-size:13px; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ok); color:#fff;
    padding:8px 16px; border-radius:999px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<main>
  <div class="tabs" id="tabs"></div>
  <div class="top"><span id="count"></span><span>Copiar → abrir → pegar → enviar</span></div>
  <div class="bar"><div id="prog"></div></div>
  <div id="foco"></div>
  <details>
    <summary>Ver lista completa</summary>
    <div id="lista"></div>
  </details>
</main>
<div id="toast">Copiado ✓ pegalo en el chat</div>

<script>
// [cuenta, rubro · ciudad, saludo]. En cada lista, primero los A y después los B.
const BARILOCHE = [
  ["nails.bright_", "Uñas · Bariloche", "¡Hola Iara!"],
  ["nailsrock_22", "Uñas · Bariloche", "¡Hola Vir!"],
  ["candesol_nails", "Uñas · Bariloche (Km 12)", "¡Hola Cande!"],
  ["beautyboxls", "Uñas + pestañas · Bariloche", "¡Hola!"],
  ["miminails.brc", "Uñas · Bariloche", "¡Hola!"],
  ["majoreddel.estetica", "Cosmetología + manicura · Bariloche", "¡Hola!"],
  ["barbara_lashes.bybarbie", "Pestañas y cejas · Bariloche", "¡Hola Bárbara!"],
  ["serena.estetica.brc", "Manos y pies · Bariloche", "¡Hola Anita!"],
  ["vittoria.bariloche", "Estética · Bariloche", "¡Hola!"],
  ["peluqueria.genesis.bariloche", "Peluquería · Bariloche", "¡Hola Marcela!"],
  ["patagoniabarbershop", "Barbería · Bariloche", "¡Buenas!"],
  ["apolo.barberia_", "Barbería · Bariloche", "¡Buenas!"],
  ["kamada.barber", "Barbería · Bariloche", "¡Buenas!"],
  ["ibiza_barber_shop", "Barbería · Bariloche", "¡Buenas!"],
  ["aurasalondebelleza_", "Peluquería + depilación · Bariloche", "¡Hola!"],
  ["candela_estetica", "Salón de belleza · Bariloche", "¡Hola!"],
  ["studiobeldadok", "Uñas + pestañas · Bariloche", "¡Hola!"],
  ["nanis.dani.brc", "Uñas · Bariloche", "¡Hola Dani!"],
  ["nailsbariloche", "Uñas · Bariloche", "¡Hola Ivy y Guada!"],
  ["carolina_manicura_bariloche", "Uñas · Bariloche", "¡Hola Carolina!"],
  ["rasgunadas.bylour", "Uñas + lifting · Bariloche", "¡Hola Lourdes!"],
];
const PAIS = [
  ["ezequieldiaznqn", "Barbería · Neuquén", "¡Hola Eze!"],
  ["nanis.dani.brc", "Uñas · Bariloche", "¡Hola Dani!"],
  ["mb.nails.ok", "Uñas · Rosario", "¡Hola Mica!"],
  ["crazybeauty_studio", "Uñas · Mar del Plata", "¡Hola!"],
  ["lasunitas.devicky", "Uñas · Mar del Plata", "¡Hola Vicky y Rochi!"],
  ["natonatalia_estudio", "Uñas + alisados · Mar del Plata", "¡Hola Natalia!"],
  ["esculpidas_cordoba", "Uñas · Córdoba", "¡Hola!"],
  ["nataliacabalestudio", "Uñas + pestañas · Mar del Plata", "¡Hola Natalia!"],
  ["kin_estudio", "Cejas, pestañas, uñas · Tucumán", "¡Hola!"],
  ["majohairstudio", "Peluquería · La Plata", "¡Hola Majo!"],
  ["rebelde.estilistas", "Peluquería · La Plata", "¡Hola!"],
  ["peluqueriaeigen", "Peluquería · La Plata", "¡Hola!"],
  ["almabonitalp", "Peluquería + estética · La Plata", "¡Hola!"],
  ["peluqueriarastalaplata", "Rastas · La Plata", "¡Hola!"],
  ["ludmilag_nails", "Uñas · Mar del Plata", "¡Hola Ludmila!"],
  ["peluquerialaplata", "Peluquería · La Plata", "¡Hola!"],
  ["nailishcordoba", "Uñas · Córdoba", "¡Hola!"],
  ["maryesteticatucuman", "Estética · Tucumán", "¡Hola María!"],
];
const LISTAS = { "Bariloche": BARILOCHE, "Resto del país": PAIS.filter(p => p[0] !== "nanis.dani.brc") };
let lista = "Bariloche";
try { lista = localStorage.getItem("prospectos-lista") || lista; } catch (e) {}
if (!LISTAS[lista]) lista = "Bariloche";
let P = LISTAS[lista];
const RESTO = "¿Cómo va? Estoy hablando con gente que tiene emprendimientos para conocer un poco cómo se manejan en el día a día. ¿Te puedo hacer un par de preguntas?";
const msg = (p) => p[2] + " " + RESTO;

const KEY = "prospectos-enviados";
let enviados = {};
try { enviados = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
const guardar = () => { try { localStorage.setItem(KEY, JSON.stringify(enviados)); } catch (e) {} };

const toast = document.getElementById("toast");
function copiar(texto) {
  try { navigator.clipboard.writeText(texto).catch(() => copiarViejo(texto)); } catch (e) { copiarViejo(texto); }
  toast.classList.add("show"); setTimeout(() => toast.classList.remove("show"), 1600);
}
function copiarViejo(texto) {
  const t = document.createElement("textarea"); t.value = texto; document.body.appendChild(t);
  t.select(); document.execCommand("copy"); t.remove();
}

// Al tocar el botón grande: copia, abre el chat y marca como enviado.
// Cuando volvés a esta pestaña, ya está el siguiente.
let abierto = null;
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && abierto) { abierto = null; render(); }
});

function el(tag, props, ...hijos) {
  const e = document.createElement(tag); Object.assign(e, props); e.append(...hijos); return e;
}

function render() {
  const tabs = document.getElementById("tabs"); tabs.replaceChildren();
  for (const nombre of Object.keys(LISTAS)) {
    const t = el("button", { textContent: nombre, className: nombre === lista ? "on" : "" });
    t.onclick = () => { lista = nombre; P = LISTAS[nombre]; try { localStorage.setItem("prospectos-lista", nombre); } catch (e) {} render(); };
    tabs.append(t);
  }
  const hechos = P.filter(p => enviados[p[0]]).length;
  document.getElementById("count").textContent = hechos + " / " + P.length + " enviados";
  document.getElementById("prog").style.width = (hechos / P.length * 100) + "%";

  const foco = document.getElementById("foco"); foco.replaceChildren();
  const p = P.find(p => !enviados[p[0]]);
  if (!p) {
    foco.append(el("div", { className: "foco fin", textContent: "¡Listo! Mandaste todos 🎉" }));
  } else {
    const go = el("a", { className: "go", textContent: "Copiar y abrir chat →",
      href: "https://ig.me/m/" + p[0], target: "_blank", rel: "noopener" });
    go.addEventListener("click", () => { copiar(msg(p)); enviados[p[0]] = true; guardar(); abierto = p[0]; });
    const saltar = el("button", { textContent: "Saltar" });
    saltar.onclick = () => { P.push(P.splice(P.indexOf(p), 1)[0]); render(); };
    const listo = el("button", { textContent: "Ya lo mandé ✓" });
    listo.onclick = () => { enviados[p[0]] = true; guardar(); render(); };
    foco.append(el("div", { className: "foco" },
      el("div", { className: "user", textContent: "@" + p[0] }),
      el("div", { className: "meta", textContent: p[1] }),
      el("div", { className: "texto", textContent: msg(p) }),
      go,
      el("div", { className: "fila" },
        el("a", { textContent: "Ver perfil", href: "https://www.instagram.com/" + p[0] + "/", target: "_blank", rel: "noopener" }),
        saltar, listo)));
  }

  const cont = document.getElementById("lista"); cont.replaceChildren();
  for (const q of P) {
    const b = el("button", { textContent: enviados[q[0]] ? "Desmarcar" : "Marcar" });
    b.onclick = () => { enviados[q[0]] = !enviados[q[0]]; guardar(); render(); };
    cont.append(el("div", { className: "item" + (enviados[q[0]] ? " done" : "") },
      el("span", { textContent: "@" + q[0] }), b));
  }
}
render();
</script>
</body>
</html>
